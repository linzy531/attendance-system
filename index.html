<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台藝大管樂線上點名系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="front-container">
    <h2>台藝大管樂線上點名系統</h2>
    <p id="todayDateDisplay"></p>
    
    <label for="studentSelect">請選擇您的姓名：</label>
    <select id="studentSelect">
      <option value="">-- 載入名單中... --</option>
    </select>

    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- 隱私條款勾選區塊 -->
    <div style="margin: 15px 0 20px 0; text-align: left; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #eee;">
      <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 12px; font-weight: normal; color: #555; cursor: pointer; margin: 0;">
        <input type="checkbox" id="agreeCheckbox" style="margin-top: 2px; width: 16px; height: 16px; cursor: pointer;">
        <span>我已閱讀並同意下方【個人資料、影像安全與保存聲明】，明白照片與紀錄僅供點名使用。</span>
      </label>
    </div>

    <!-- 預設停用 (disabled)，勾選後解鎖 -->
    <button id="captureBtn" onclick="takePhoto()" disabled style="opacity: 0.5; cursor: not-allowed;">拍照並提交點名</button>
    <p id="statusMsg"></p>
    
    <a href="admin.html">切換至行政點名矩陣總表</a>

    <footer>
      <p class="footer-notice">
        【個人資料、影像安全與保存聲明】<br>
        本系統所採集之照片與出席紀錄僅供國立臺灣藝術大學音樂學系管樂團內部點名與行政核對使用。<br>
        所有影像資料皆受系統存取控制防護，嚴禁非授權存取、外流或作任何第三方用途。<br>
        點名紀錄與照片將於學期結束或行政核對完成後進行定期清除與妥善保存處置。
      </p>
      <p class="footer-copy">
        &copy; 國立臺灣藝術大學音樂學系管樂團 <span class="dev-code">Designed by Una Lin</span>
      </p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

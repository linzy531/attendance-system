<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台藝大管樂線上點名系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="front-container">
    <h2>台藝大管樂線上點名系統</h2>
    <p id="todayDateDisplay"></p>
    
    <label for="studentSelect">請選擇您的姓名：</label>
    <select id="studentSelect">
      <option value="">-- 載入名單中... --</option>
    </select>

    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- 簡潔勾選區 -->
    <div style="margin: 15px 0 20px 0; text-align: left;">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; color: #555; cursor: pointer;">
        <input type="checkbox" id="agreeCheckbox" disabled style="width: 16px; height: 16px;">
        <span>我已閱讀並同意 <a href="javascript:void(0)" id="openModalBtn" style="color:#0066cc; text-decoration:underline; margin:0;">【個資與安全聲明】</a></span>
      </label>
    </div>

    <button id="captureBtn" onclick="takePhoto()" disabled style="opacity: 0.5; cursor: not-allowed;">拍照並提交點名</button>
    <p id="statusMsg"></p>
    
    <a href="admin.html">切換至行政點名矩陣總表</a>

    <footer>
      <p class="footer-copy">
        &copy; 國立臺灣藝術大學音樂學系管樂團 <span class="dev-code">Designed by Una Lin</span>
      </p>
    </footer>
  </div>

  <!-- 隱私與條款閱讀彈窗 Modal -->
  <div id="termsModal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin: 0; font-size: 16px; color: #1a1a1a;">個人資料、影像安全與保存聲明</h3>
      <div class="modal-content">
        <p style="margin-bottom: 8px;"><b>1. 採集用途：</b>本系統所採集之照片與出席紀錄僅供國立臺灣藝術大學音樂學系管樂團內部點名與行政核對使用。</p>
        <p style="margin-bottom: 8px;"><b>2. 安全防護：</b>所有影像資料皆受系統存取控制防護，嚴禁非授權存取、外流或作任何第三方用途。</p>
        <p><b>3. 資料保存與處置：</b>點名紀錄與照片將於學期結束或行政核對完成後進行定期清除與妥善處置。</p>
      </div>
      <button id="confirmAgreeBtn" style="width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold;">我已閱讀並同意條款</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

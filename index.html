<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上拍照點名系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>線上即時點名系統</h2>
    <p id="todayDateDisplay" style="color: #666; font-weight: bold;"></p>
    
    <label for="studentSelect" style="margin-top: 15px; display: block;">請選擇您的姓名：</label>
    <select id="studentSelect">
      <option value="">-- 載入名單中... --</option>
    </select>

    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <button id="captureBtn" onclick="takePhoto()">拍照並提交點名</button>
    <p id="statusMsg"></p>
    <a href="admin.html" style="margin-top: 15px; display: inline-block;">👉 切換至行政點名矩陣總表</a>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

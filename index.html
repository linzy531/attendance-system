<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台藝大管樂線上點名系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>台藝大管樂線上點名系統</h2>
    <p id="todayDateDisplay"></p>
    
    <label for="studentSelect">請選擇您的姓名：</label>
    <select id="studentSelect">
      <option value="">-- 載入名單中... --</option>
    </select>

    <div class="camera-box">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <button id="captureBtn" onclick="takePhoto()">拍照並提交點名</button>
    <p id="statusMsg"></p>
    
    <a href="admin.html">切換至行政點名矩陣總表</a>

    <!-- 把 footer 放在 container 裡面，跟著白框一起置中 -->
    <footer>
      <p style="margin-bottom: 4px;">
        【個人資料與影像安全聲明】<br>
        本系統所採集之照片與出席紀錄僅供國立臺灣藝術大學音樂學系管樂團內部點名與行政核對使用。<br>
        所有影像資料皆受系統存取控制防護，嚴禁非授權存取、外流或作任何第三方用途。
      </p>
      <p>&copy; 國立臺灣藝術大學音樂學系管樂團 &bull; <code>/* dev: Una Lin */</code></p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

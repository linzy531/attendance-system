<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>行政出席矩陣與名單管理總表</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入 Chart.js 圖表庫與 SheetJS Excel 匯出庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .container { max-width: 95%; width: 100%; margin: 20px auto; }
    .table-wrapper { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
    th { background-color: #007bff; color: white; white-space: nowrap; }
    .status-ok { color: green; font-weight: bold; }
    .status-no { color: #dc3545; background-color: #fff0f0; }
    .photo-thumb { width: 45px; height: 35px; object-fit: cover; border-radius: 4px; cursor: pointer; display: block; margin: 4px auto 0; }
    .ip-tag { font-size: 11px; color: #666; display: block; margin-top: 2px; }
    
    .charts-container {
      display: flex;
      gap: 20px;
      margin: 25px 0;
      flex-wrap: wrap;
    }
    .chart-box {
      flex: 1;
      min-width: 300px;
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .management-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      text-align: left;
    }
    .form-inline { display: flex; gap: 10px; margin-bottom: 15px; }
    .form-inline input { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    .student-tag {
      display: inline-flex;
      align-items: center;
      background: #e9ecef;
      padding: 5px 10px;
      border-radius: 20px;
      margin: 4px;
      font-size: 14px;
    }
    .student-tag button {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      line-height: 16px;
      margin-left: 8px;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
    }
    #loginSection { max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
    .export-btn { background-color: #28a745; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
    .export-btn:hover { background-color: #218838; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginSection">
      <h2>行政管理員登入</h2>
      <input type="email" id="loginEmail" placeholder="電子郵件" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
      <input type="password" id="loginPassword" placeholder="密碼" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
      <button id="emailLoginBtn">Email 登入</button>
      <button id="googleLoginBtn" style="background-color: #db4437; margin-top: 10px;">使用 Google 帳號登入</button>
      <p id="loginError" style="color:red; margin-top:10px;"></p>
    </div>

    <div id="adminContent" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>行政總台管理與出席表</h2>
        <button id="logoutBtn" style="width: auto; padding: 8px 16px; background-color: #6c757d;">登出</button>
      </div>

      <!-- 統計圖表區塊 -->
      <div class="charts-container">
        <div class="chart-box">
          <h3>📊 全體總出席率</h3>
          <canvas id="overallPieChart"></canvas>
        </div>
        <div class="chart-box">
          <h3>📅 每日出席人數</h3>
          <canvas id="dailyBarChart"></canvas>
        </div>
      </div>

      <div class="management-card">
        <h3 style="margin-top:0;">📋 班級學生名單編輯</h3>
        <div class="form-inline">
          <input type="text" id="newStudentId" placeholder="座號 (如: 01)" style="width: 100px;">
          <input type="text" id="newStudentName" placeholder="學生姓名" style="width: 150px;">
          <button id="addStudentBtn" style="width: auto; margin:0; padding: 8px 16px;">新增學生</button>
        </div>
        <div id="studentListTags">名單載入中...</div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0;">📊 出席紀錄總表</h3>
        <button id="exportExcelBtn" class="export-btn">📥 匯出 Excel 報表</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr id="tableHeader">
              <th>座號</th>
              <th>姓名</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <a href="index.html" style="margin-top:20px; display:inline-block;">← 返回學生點名頁</a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { 
      onAuthStateChanged, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { 
      collection, 
      getDocs, 
      doc, 
      setDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    let currentStudents = [];
    let pieChartInstance = null;
    let barChartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      onAuthStateChanged(auth, (user) => {
        const loginSection = document.getElementById('loginSection');
        const adminContent = document.getElementById('adminContent');
        if (user) {
          if (loginSection) loginSection.style.display = 'none';
          if (adminContent) adminContent.style.display = 'block';
          loadAllData();
        } else {
          if (loginSection) loginSection.style.display = 'block';
          if (adminContent) adminContent.style.display = 'none';
        }
      });

      document.getElementById('emailLoginBtn').onclick = () => {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;
        signInWithEmailAndPassword(auth, email, pass).catch(err => {
          document.getElementById('loginError').innerText = "登入失敗：" + err.message;
        });
      };

      document.getElementById('googleLoginBtn').onclick = () => {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => {
          document.getElementById('loginError').innerText = "Google 登入失敗：" + err.message;
        });
      };

      document.getElementById('logoutBtn').onclick = () => signOut(auth);

      document.getElementById('addStudentBtn').onclick = async () => {
        const id = document.getElementById('newStudentId').value.trim();
        const name = document.getElementById('newStudentName').value.trim();
        if (!id || !name) {
          alert("請填寫座號與姓名！");
          return;
        }
        await setDoc(doc(db, "students", id), { id, name });
        document.getElementById('newStudentId').value = '';
        document.getElementById('newStudentName').value = '';
        loadAllData();
      };

      document.getElementById('exportExcelBtn').onclick = exportToExcel;
    });

    async function loadAllData() {
      await loadStudentManagement();
      await loadAttendanceData();
    }

    async function loadStudentManagement() {
      const querySnapshot = await getDocs(collection(db, "students"));
      currentStudents = [];
      const container = document.getElementById('studentListTags');
      if (!container) return;
      container.innerHTML = '';

      querySnapshot.forEach(docSnap => {
        currentStudents.push(docSnap.data());
      });

      currentStudents.sort((a, b) => a.id.localeCompare(b.id));

      currentStudents.forEach(s => {
        const tag = document.createElement('span');
        tag.className = 'student-tag';
        tag.innerHTML = `${s.id} ${s.name} `;
        
        const delBtn = document.createElement('button');
        delBtn.textContent = '×';
        delBtn.onclick = () => deleteStudent(s.id);
        
        tag.appendChild(delBtn);
        container.appendChild(tag);
      });
    }

    async function deleteStudent(id) {
      if (confirm(`確定要刪除座號 ${id} 的學生嗎？`)) {
        await deleteDoc(doc(db, "students", id));
        loadAllData();
      }
    }

    async function loadAttendanceData() {
      const tableHeader = document.getElementById('tableHeader');
      const tableBody = document.getElementById('tableBody');
      if (!tableHeader || !tableBody) return;
      
      tableHeader.innerHTML = '<th>座號</th><th>姓名</th>';
      tableBody.innerHTML = '';

      const querySnapshot = await getDocs(collection(db, "attendance"));
      const records = [];
      querySnapshot.forEach(docSnap => records.push(docSnap.data()));

      const uniqueDates = [...new Set(records.map(r => r.date))].sort();
      if (uniqueDates.length === 0) {
        uniqueDates.push(new Date().toISOString().split('T')[0]);
      }

      uniqueDates.forEach(date => {
        const th = document.createElement('th');
        th.textContent = date;
        tableHeader.appendChild(th);
      });

      let totalPresent = 0;
      let totalSlots = currentStudents.length * uniqueDates.length;
      let dailyCounts = {};
      uniqueDates.forEach(d => dailyCounts[d] = 0);

      currentStudents.forEach(student => {
        const tr = document.createElement('tr');
        let rowHTML = `<td>${student.id}</td><td><b>${student.name}</b></td>`;

        uniqueDates.forEach(date => {
          const record = records.find(r => r.id === student.id && r.date === date);
          if (record) {
            totalPresent++;
            dailyCounts[date]++;
            const ipDisplay = record.ip ? `<span class="ip-tag">IP: ${record.ip}</span>` : '';
            rowHTML += `
              <td class="status-ok">
                ✅ ${record.time}
                ${ipDisplay}
                <a href="${record.photo}" target="_blank">
                  <img src="${record.photo}" class="photo-thumb" title="點擊檢視照片">
                </a>
              </td>
            `;
          } else {
            rowHTML += `<td class="status-no">缺席</td>`;
          }
        });

        tr.innerHTML = rowHTML;
        tableBody.appendChild(tr);
      });

      // 渲染圖表
      renderCharts(totalPresent, totalSlots - totalPresent, uniqueDates, dailyCounts);
    }

    // 繪製與更新圖表
    function renderCharts(presentCount, absentCount, dates, dailyCounts) {
      if (pieChartInstance) pieChartInstance.destroy();
      if (barChartInstance) barChartInstance.destroy();

      const ctxPie = document.getElementById('overallPieChart').getContext('2d');
      pieChartInstance = new Chart(ctxPie, {
        type: 'pie',
        data: {
          labels: ['出席', '缺席'],
          datasets: [{
            data: [presentCount, absentCount],
            backgroundColor: ['#28a745', '#dc3545']
          }]
        }
      });

      const ctxBar = document.getElementById('dailyBarChart').getContext('2d');
      barChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: dates,
          datasets: [{
            label: '每日出席人數',
            data: dates.map(d => dailyCounts[d]),
            backgroundColor: '#007bff'
          }]
        },
        options: {
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });
    }

    // 匯出成 Excel
    function exportToExcel() {
      const table = document.querySelector('table');
      // 複製表格並移除照片與 HTML 標籤
      const clonedTable = table.cloneNode(true);
      clonedTable.querySelectorAll('img').forEach(img => img.remove());
      
      const wb = XLSX.utils.table_to_book(clonedTable, { sheet: "點名紀錄總表" });
      XLSX.writeFile(wb, `點名出席總表_${new Date().toISOString().split('T')[0]}.xlsx`);
    }
  </script>
</body>
</html>

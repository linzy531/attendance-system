<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政出席矩陣與名單管理總表</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- 登入區塊 -->
    <div id="loginSection">
      <h2 style="text-align: center; margin-bottom: 20px;">行政管理員登入</h2>
      <input type="email" id="loginEmail" placeholder="電子郵件" style="width:100%; padding:12px; margin-bottom:12px; box-sizing:border-box; border:1px solid #ddd; border-radius:6px;">
      <input type="password" id="loginPassword" placeholder="密碼" style="width:100%; padding:12px; margin-bottom:15px; box-sizing:border-box; border:1px solid #ddd; border-radius:6px;">
      <button id="emailLoginBtn" style="width:100%; padding:12px; background-color:#0066cc; color:white; border:none; border-radius:6px; cursor:pointer;">Email 登入</button>
      <button id="googleLoginBtn" style="width:100%; padding:12px; background-color: #db4437; color:white; border:none; border-radius:6px; margin-top: 10px; cursor:pointer;">使用 Google 帳號登入</button>
      <p id="loginError" style="color:red; margin-top:10px; text-align:center;"></p>
      <div style="margin-top: 20px; text-align: center;">
        <a href="index.html" class="home-btn">回到點名首頁</a>
      </div>
    </div>

    <!-- 後台內容區塊 -->
    <div id="adminContent" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>行政總台管理與出席表</h2>
        <div>
          <a href="index.html" class="home-btn" style="margin-right: 8px;">回到點名首頁</a>
          <button id="logoutBtn" style="width: auto; padding: 8px 16px; background-color: #6c757d; color:white; border:none; border-radius:6px; cursor:pointer;">登出</button>
        </div>
      </div>

      <!-- 統計圖表 -->
      <div class="charts-container">
        <div class="chart-box">
          <h3 style="margin-bottom: 15px;">全體總出席率</h3>
          <canvas id="overallPieChart"></canvas>
        </div>
        <div class="chart-box">
          <h3 style="margin-bottom: 15px;">每日出席人數</h3>
          <canvas id="dailyBarChart"></canvas>
        </div>
      </div>

      <!-- 團員編輯 -->
      <div class="management-card">
        <h3 style="margin-top:0; margin-bottom: 15px;">樂團團員名單編輯</h3>
        <div class="form-inline">
          <input type="text" id="newStudentId" placeholder="學號 (如: 11411201)" style="width: 180px;">
          <input type="text" id="newStudentName" placeholder="團員姓名" style="width: 150px;">
          <button id="addStudentBtn" style="width: auto; margin:0; padding: 10px 18px; background-color:#0066cc; color:white; border:none; border-radius:6px; cursor:pointer;">新增團員</button>
        </div>
        <div id="studentListTags">名單載入中...</div>
      </div>

      <!-- 出席總表與匯出 -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0;">出席紀錄總表</h3>
        <button id="exportExcelBtn" class="export-btn">匯出 Excel 報表</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr id="tableHeader">
              <th>學號</th>
              <th>姓名</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div style="margin-top: 25px;">
        <a href="index.html" class="home-btn">回到點名首頁</a>
      </div>
    </div>

    <!-- 清爽無聲明頁腳 -->
    <footer>
      <p class="footer-copy">
        &copy; 國立臺灣藝術大學音樂學系管樂團 <span class="dev-code">Designed by Una Lin</span>
      </p>
    </footer>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { 
      onAuthStateChanged, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
    import { 
      collection, 
      getDocs, 
      doc, 
      setDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    let currentStudents = [];
    let pieChartInstance = null;
    let barChartInstance = null;

    onAuthStateChanged(auth, (user) => {
      const loginSection = document.getElementById('loginSection');
      const adminContent = document.getElementById('adminContent');
      if (user) {
        if (loginSection) loginSection.style.display = 'none';
        if (adminContent) adminContent.style.display = 'block';
        loadAllData();
      } else {
        if (loginSection) loginSection.style.display = 'block';
        if (adminContent) adminContent.style.display = 'none';
      }
    });

    const emailLoginBtn = document.getElementById('emailLoginBtn');
    if (emailLoginBtn) {
      emailLoginBtn.onclick = () => {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;
        signInWithEmailAndPassword(auth, email, pass).catch(err => {
          console.error("登入錯誤：", err);
          const errEl = document.getElementById('loginError');
          if (errEl) errEl.innerText = "登入失敗：" + err.message;
        });
      };
    }

    const googleLoginBtn = document.getElementById('googleLoginBtn');
    if (googleLoginBtn) {
      googleLoginBtn.onclick = () => {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => {
          console.error("Google 登入錯誤：", err);
          const errEl = document.getElementById('loginError');
          if (errEl) errEl.innerText = "Google 登入失敗：" + err.message;
        });
      };
    }

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.onclick = () => signOut(auth);
    }

    const addStudentBtn = document.getElementById('addStudentBtn');
    if (addStudentBtn) {
      addStudentBtn.onclick = async () => {
        const id = document.getElementById('newStudentId').value.trim();
        const name = document.getElementById('newStudentName').value.trim();
        if (!id || !name) {
          alert("請填寫學號與姓名！");
          return;
        }
        await setDoc(doc(db, "students", id), { id, name });
        document.getElementById('newStudentId').value = '';
        document.getElementById('newStudentName').value = '';
        loadAllData();
      };
    }

    const exportExcelBtn = document.getElementById('exportExcelBtn');
    if (exportExcelBtn) {
      exportExcelBtn.onclick = exportToExcel;
    }

    async function loadAllData() {
      await loadStudentManagement();
      await loadAttendanceData();
    }

    async function loadStudentManagement() {
      try {
        const querySnapshot = await getDocs(collection(db, "students"));
        currentStudents = [];
        const container = document.getElementById('studentListTags');
        if (!container) return;
        container.innerHTML = '';

        querySnapshot.forEach(docSnap => {
          currentStudents.push(docSnap.data());
        });

        currentStudents.sort((a, b) => a.id.localeCompare(b.id));

        currentStudents.forEach(s => {
          const tag = document.createElement('span');
          tag.className = 'student-tag';
          tag.innerHTML = `${s.id} ${s.name} `;
          
          const delBtn = document.createElement('button');
          delBtn.textContent = '×';
          delBtn.onclick = () => deleteStudent(s.id);
          
          tag.appendChild(delBtn);
          container.appendChild(tag);
        });
      } catch (err) {
        console.error("載入團員失敗：", err);
      }
    }

    async function deleteStudent(id) {
      if (confirm(`確定要刪除學號 ${id} 的團員嗎？`)) {
        await deleteDoc(doc(db, "students", id));
        loadAllData();
      }
    }

    async function loadAttendanceData() {
      try {
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        if (!tableHeader || !tableBody) return;
        
        tableHeader.innerHTML = '<th>學號</th><th>姓名</th>';
        tableBody.innerHTML = '';

        const querySnapshot = await getDocs(collection(db, "attendance"));
        const records = [];
        querySnapshot.forEach(docSnap => records.push(docSnap.data()));

        const uniqueDates = [...new Set(records.map(r => r.date))].sort();
        if (uniqueDates.length === 0) {
          uniqueDates.push(new Date().toISOString().split('T')[0]);
        }

        uniqueDates.forEach(date => {
          const th = document.createElement('th');
          th.textContent = date;
          tableHeader.appendChild(th);
        });

        let totalPresent = 0;
        let totalSlots = currentStudents.length * uniqueDates.length;
        let dailyCounts = {};
        uniqueDates.forEach(d => dailyCounts[d] = 0);

        currentStudents.forEach(student => {
          const tr = document.createElement('tr');
          let rowHTML = `<td>${student.id}</td><td><b>${student.name}</b></td>`;
